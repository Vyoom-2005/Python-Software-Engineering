[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-pdf-report-generator"
version = "1.0.0"
description = "End-to-end automated PDF reporting capstone with data processing, HTTP API integration, CLI, and scheduling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
reportgen = "enterprise_report.cli:main"

[tool.setuptools.packages.find]
include = ["enterprise_report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
