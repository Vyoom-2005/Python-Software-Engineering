[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="fastapi-jwt-microservice"
version="1.0.0"
description="Secure FastAPI REST microservice with JWT authentication"
requires-python=">=3.10"
dependencies=["fastapi>=0.110,<1","uvicorn[standard]>=0.27,<1","pydantic[email]>=2,<3","PyJWT>=2.8,<3","bcrypt>=4,<5","sqlalchemy>=2,<3"]
